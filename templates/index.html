<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AI Chatbot</title>

<link rel="stylesheet"
href="{{ url_for('static',
filename='style.css') }}">

</head>

<body>

<div class="container">

<div class="header">

<div class="logo">
🤖
</div>

<h1>AI Chatbot</h1>

<p>Your Personal Python Assistant</p>

</div>

<div id="chatbox">

<p class="bot">

<b>Bot:</b>

Hello 👋 Welcome to AI Chatbot

</p>

</div>

<div class="input-area">

<input

type="text"

id="message"

placeholder="Type your message...">

<button onclick="sendMessage()">

📩 Send

</button>

<button onclick="clearChat()">

🗑 Clear

</button>

<button onclick="darkMode()">

🌙 Dark

</button>

</div>

</div>

<script src="{{ url_for('static',
filename='script.js') }}"></script>

</body>

</html>
